name: Shopee cloud collector
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: Test API authentication without bypassing cache
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: catalog-state
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'ultrapackadm/shopee-catalog-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Collect without publishing
        env:
          ACHADINHOS_SHOPEE_CREDENTIALS: ${{ secrets.ACHADINHOS_SHOPEE_CREDENTIALS }}
          CATALOG_STATE_KEY: ${{ secrets.CATALOG_STATE_KEY }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "true" ]; then
            python runner.py --probe
          else
            python runner.py
          fi
      - name: Preserve encrypted state
        run: |
          git config user.name 'Catalog collector'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- catalog-state.enc runner-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh encrypted catalog state'
            git push origin HEAD:main
          fi
          cat runner-status.json >> "$GITHUB_STEP_SUMMARY"
